repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1500] # docs/example-bars.csv, the site's synthetic example market
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: no-local-paths
        name: no local paths or personal email addresses in tracked files
        entry: '(?i)(C:\\Users|/c/Users|AI Trading|OneDrive|@gmail\.com|@outlook\.com|@yahoo\.com|@icloud\.com)'
        language: pygrep
        exclude: ^\.pre-commit-config\.yaml$
